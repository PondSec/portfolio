# portfolio.pondsec.com – clean, stable public URLs for the static portfolio.
# Place this server block in /etc/nginx/conf.d/ on the portfolio host.
server {
    listen 80;
    server_name portfolio.pondsec.com;

    root /usr/share/nginx/html/portfolio;
    index index.html;

    # TLS terminates upstream. Keep redirect locations relative so the browser
    # stays on the original HTTPS scheme.
    absolute_redirect off;
    port_in_redirect off;

    # One canonical URL per page. The domain root remains a shareable entry
    # point but resolves to the visible home URL.
    location = / {
        return 301 /home$is_args$args;
    }

    location = /home {
        default_type text/html;
        alias /usr/share/nginx/html/portfolio/index.html;
    }

    location = /profil {
        default_type text/html;
        alias /usr/share/nginx/html/portfolio/profile.html;
    }

    location = /projekte {
        default_type text/html;
        alias /usr/share/nginx/html/portfolio/projects.html;
    }

    location = /forschung {
        default_type text/html;
        alias /usr/share/nginx/html/portfolio/research.html;
    }

    location = /zertifikate {
        default_type text/html;
        alias /usr/share/nginx/html/portfolio/credentials.html;
    }

    # Never expose duplicate or trailing-slash variants as canonical pages.
    location = /home/ { return 301 /home$is_args$args; }
    location = /profil/ { return 301 /profil$is_args$args; }
    location = /projekte/ { return 301 /projekte$is_args$args; }
    location = /forschung/ { return 301 /forschung$is_args$args; }
    location = /zertifikate/ { return 301 /zertifikate$is_args$args; }

    # Preserve all existing links, bookmarks and Google results.
    location = /index.html { return 301 /home$is_args$args; }
    location = /profile.html { return 301 /profil$is_args$args; }
    location = /projects.html { return 301 /projekte$is_args$args; }
    location = /research.html { return 301 /forschung$is_args$args; }
    location = /credentials.html { return 301 /zertifikate$is_args$args; }
    location = /forschungsarbeit.html { return 301 /forschung$is_args$args; }

    # Redirect the complete pre-redesign portfolio without leaving old pages
    # accessible or generating 404s from historical bookmarks/search results.
    location = /certifications.html { return 301 /zertifikate$is_args$args; }
    location = /references.html { return 301 /profil$is_args$args; }
    location = /projects/index.html { return 301 /projekte$is_args$args; }
    location = /projects/ { return 301 /projekte$is_args$args; }
    location = /projects/inventory-pro.html { return 301 "/projekte#inventory-pro"; }
    location = /projects/self-hosted-services.html { return 301 "/projekte#hosting"; }
    location = /projects/opnsense-infrastructure.html { return 301 "/projekte#opnsense"; }
    location = /projects/load-balancing-research.html { return 301 /forschung$is_args$args; }
    location = /projects/switchmanager.html { return 301 "/projekte#switchmanager"; }

    # Earlier extensionless English URLs are redirected as well.
    location = /profile { return 301 /profil$is_args$args; }
    location = /projects { return 301 /projekte$is_args$args; }
    location = /research { return 301 /forschung$is_args$args; }
    location = /credentials { return 301 /zertifikate$is_args$args; }
    location = /certifications { return 301 /zertifikate$is_args$args; }
    location = /references { return 301 /profil$is_args$args; }
    location = /forschungsarbeit { return 301 /forschung$is_args$args; }
    location = /projects/inventory-pro { return 301 "/projekte#inventory-pro"; }
    location = /projects/self-hosted-services { return 301 "/projekte#hosting"; }
    location = /projects/opnsense-infrastructure { return 301 "/projekte#opnsense"; }
    location = /projects/load-balancing-research { return 301 /forschung$is_args$args; }
    location = /projects/switchmanager { return 301 "/projekte#switchmanager"; }

    location / {
        try_files $uri $uri/ =404;
    }
}
